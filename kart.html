<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Kart Battle</title>
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/css/kart.css" />
  <script src="/config.js"></script>
  <script src="/vendor/peerjs.min.js" defer></script>
  <script src="/vendor/qrcode.js"></script>
  <script type="importmap">{ "imports": { "three": "/vendor/three.module.min.js" } }</script>
  <script type="module" src="/js/kart/game.js"></script>
</head>
<body>
  <canvas id="gl"></canvas>

  <!-- MENU -->
  <section id="menu" class="panel">
    <div class="card">
      <div class="logo">🏎️</div>
      <h1>Kart Battle</h1>
      <p class="sub">Grab weapons. Blast friends. Last kart rolling wins.</p>
      <div id="lan-badge" class="lan-badge" hidden>Wi-Fi mode · works offline</div>
      <input id="name" maxlength="12" placeholder="Your name" autocomplete="nickname" spellcheck="false" />
      <button class="btn primary" id="b-solo">Play vs Bots</button>
      <button class="btn tint" id="b-host">Host a Game</button>
      <button class="btn gray" id="b-join">Join a Game</button>
      <a class="back" href="/">← Back to Poker</a>
    </div>
  </section>

  <!-- HOST SETUP -->
  <section id="setup" class="panel" hidden>
    <div class="card">
      <h2 id="setup-title">New Game</h2>
      <label class="lbl">Bots</label>
      <div class="seg" id="seg-bots"><button data-v="0">0</button><button data-v="2" class="on">2</button><button data-v="4">4</button><button data-v="6">6</button></div>
      <label class="lbl">First to</label>
      <div class="seg" id="seg-target"><button data-v="5">5 kills</button><button data-v="10" class="on">10 kills</button><button data-v="20">20 kills</button></div>
      <button class="btn primary" id="setup-go">Start</button>
      <button class="btn gray" data-back>Cancel</button>
    </div>
  </section>

  <!-- JOIN -->
  <section id="join" class="panel" hidden>
    <div class="card">
      <h2>Join a Game</h2>
      <div id="rooms-wrap" hidden>
        <label class="lbl">Games on this Wi-Fi</label>
        <div id="rooms"></div>
      </div>
      <label class="lbl">Or enter a code</label>
      <input id="code" class="code" maxlength="5" placeholder="CODE" autocomplete="off" autocapitalize="characters" spellcheck="false" />
      <button class="btn primary" id="join-go">Join</button>
      <button class="btn gray" data-back>Cancel</button>
    </div>
  </section>

  <!-- INVITE -->
  <section id="invite" class="panel" hidden>
    <div class="card">
      <h2>Invite Friends</h2>
      <div id="inv-qr" class="qr"></div>
      <div id="inv-code" class="bigcode"></div>
      <div id="inv-url" class="url"></div>
      <button class="btn tint" id="inv-copy">Copy Link</button>
      <button class="btn primary" id="inv-done">Done</button>
    </div>
  </section>

  <!-- HUD -->
  <div id="hud" hidden>
    <div class="top">
      <div class="hp"><div id="hp-fill"></div><span id="hp-text">100</span></div>
      <div class="timer" id="timer">3:00</div>
      <div class="board" id="board"></div>
    </div>
    <div class="feed" id="feed"></div>
    <div class="weapon" id="weapon"></div>
    <div id="banner" hidden></div>
    <div id="popup"></div>
    <button class="icon-btn" id="btn-invite" hidden>＋</button>
    <button class="icon-btn quit" id="btn-quit">✕</button>
    <div class="controls" id="controls">
      <div class="steer">
        <button class="pad" id="pad-l" aria-label="Steer left">◀</button>
        <button class="pad" id="pad-r" aria-label="Steer right">▶</button>
      </div>
      <button class="pad fire" id="pad-f" aria-label="Fire">FIRE</button>
    </div>
  </div>
  <div id="toast"></div>
</body>
</html>
